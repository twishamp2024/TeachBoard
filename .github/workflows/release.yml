# Builds and tests the macOS disk image (release/macos/setup.dmg) on a macOS
# runner. A DMG can only be produced on macOS; the Windows installer is built
# and tested locally with `npm run dist:win` (see docs/PACKAGING.md).
#
# Deliberately lean: one job, run only when a version tag is pushed, and never
# more than one run at a time.
name: Build macOS installer

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    name: macOS setup.dmg
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build disk image
        # Optional Developer ID signing and notarisation (see docs/PACKAGING.md).
        # Secrets that are not configured arrive empty; only export real values
        # so an unsigned build stays unsigned (ad hoc) instead of failing.
        run: |
          set -euo pipefail
          if [ -n "$SEC_CSC_LINK" ]; then export CSC_LINK="$SEC_CSC_LINK"; fi
          if [ -n "$SEC_CSC_KEY_PASSWORD" ]; then export CSC_KEY_PASSWORD="$SEC_CSC_KEY_PASSWORD"; fi
          if [ -n "$SEC_APPLE_ID" ]; then export APPLE_ID="$SEC_APPLE_ID"; fi
          if [ -n "$SEC_APPLE_APP_SPECIFIC_PASSWORD" ]; then export APPLE_APP_SPECIFIC_PASSWORD="$SEC_APPLE_APP_SPECIFIC_PASSWORD"; fi
          if [ -n "$SEC_APPLE_TEAM_ID" ]; then export APPLE_TEAM_ID="$SEC_APPLE_TEAM_ID"; fi
          npm run dist:mac
        env:
          SEC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          SEC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          SEC_APPLE_ID: ${{ secrets.APPLE_ID }}
          SEC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SEC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Mount the DMG, check the bundle, run e2e against the installed app
        run: |
          set -euo pipefail
          hdiutil attach release/macos/setup.dmg -nobrowse -mountpoint /Volumes/tb-setup
          ls -la /Volumes/tb-setup
          test -L /Volumes/tb-setup/Applications
          APP=$(ls -d /Volumes/tb-setup/*.app | head -1)
          codesign --verify --deep --strict "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundleName|CFBundleShortVersionString|CFBundleIdentifier'
          lipo -archs "$APP/Contents/MacOS/"*
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$APP" "$RUNNER_TEMP/Applications/"
          hdiutil detach /Volumes/tb-setup
          NAME=$(basename "$APP" .app)
          TB_EXECUTABLE="$RUNNER_TEMP/Applications/$NAME.app/Contents/MacOS/$NAME" npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: macos-setup
          path: release/macos/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-test-results
          path: test-results/
