<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22B89A"/>
      <stop offset="1" stop-color="#0A6152"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F1EF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#04332B" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>
  <!-- easel legs -->
  <path d="M398 690 L338 828 M626 690 L686 828" stroke="#E9F7F3" stroke-width="34" stroke-linecap="round"/>
  <!-- board -->
  <rect x="214" y="236" width="596" height="452" rx="42" fill="url(#board)" filter="url(#shadow)"/>
  <!-- highlighter swipe -->
  <path d="M296 546 L566 546" stroke="#F6CE3C" stroke-width="54" stroke-linecap="round" opacity="0.92"/>
  <!-- ink -->
  <path d="M292 488 C 352 340, 414 336, 452 430 S 556 566, 712 340" fill="none" stroke="#1E2228" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pen nib dot -->
  <circle cx="712" cy="340" r="27" fill="#0F8B78" stroke="#FFFFFF" stroke-width="10"/>
</svg>
